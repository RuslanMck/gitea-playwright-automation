name: CI Tests

on:
    workflow_dispatch:

jobs:
    test:
        name: CI health check test run
        runs-on: ubuntu-latest

        steps:
            - name: Health Check
              run: echo "[DEBUG LOG] CI Setup Health Check"

            - name: Checkout code from repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install project dependencies
              run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium
            
            - name: Install Docker if not present
              run: |
                if 
                  ! command -v docker &> /dev/null; 
                  then
                    echo "Docker not found, installing..."
                    sudo apt-get update
                    sudo apt-get install -y docker.io
                    sudo systemctl start docker
                else 
                  echo "Docker already installed: $(docker --version)"
                fi

            - name: Start Docker container with Gitea image 1.24.6
              run: |
                docker run -d \
                  --name gitea_test_environment \ 
                  -p 3000:3000 \
                  gitea/gitea:1.24.6

            - name: Check if Gitea is ready
              run: |
                echo "Waiting for Gitea to start..."
                for i in {1..30}; do
                  if curl -sf http://localhost:3000/api/v1/version; 
                  then
                    echo "Gitea is ready!"
                    exit 0
                  fi
                  sleep 2
                done
                echo "Gitea failed to start in time."
                exit 1

